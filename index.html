<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Seojun Day!🎂💗</title>

    <meta property="og:image" content="https://bomina10730.github.io/birthday-for-you/img/greeting.jpg">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- 첫 화면 -->
    <main class="intro">

        <button type="button" class="hello-button" id="helloButton">
            입장하<br>
            기...
        </button>

    </main>


    <!-- 커튼 -->
    <div class="curtain-wrap" id="curtain">

        <div class="curtain curtain-left"></div>
        <div class="curtain curtain-right"></div>

    </div>

    <!-- =========================
     VVIP 확인 화면
========================= -->

<main class="vvip-screen" id="vvipScreen">

    <!-- 캐릭터 이미지 -->
    <div class="character-box">
        <img
            src="img/vvip.png"
            alt="VVIP 담당 직원"
        >
    </div>


    <!-- 말풍선 -->
    <div class="speech-bubble">

        <p>
            오늘은 VVIP 손님<br>
            예약건만 한 건 있습니다.<br>
            김서준님 맞으신가요?
        </p>

    </div>


    <!-- 선택 버튼 -->
    <div class="answer-buttons">

        <button
            type="button"
            class="answer-button yes-button"
            id="yesButton">
            네!
        </button>

        <button
            type="button"
            class="answer-button no-button"
            id="noButton">
            아뇨?
        </button>

    </div>

    <!-- =========================
     아니요 페이지
    ========================= -->

<main class="no-screen" id="noScreen">

    <!-- ① 하? -->
    <div class="no-scene scene-huh" id="sceneHuh">
    </div>


    <!-- =========================
        ② 캐릭터 + 문구
    ========================= -->

    <div class="no-scene scene-character" id="sceneCharacter">

        <div class="character-card">

            <!-- 캐릭터 사진 -->
            <div class="no-character-box">
                <img 
                    src="img/no.jpg" 
                    alt="캐릭터"
                >
            </div>

            <!-- 문구 -->
            <p class="no-text">
                그럼 왜 들어옴? 나가세요.
            </p>

        </div>

    </div>


    <!-- ③ 겔아웃! -->
    <div class="no-scene scene-getout" id="sceneGetout">
    </div>


    <!-- ④ 발 사진 + 퍽퍽 -->
    <div class="no-scene scene-feet" id="sceneFeet">

    <!-- 💥 빨간 타격 효과 -->
    <div class="hit-flash"></div>

    <!-- 왼쪽 💥 -->
    <span class="impact impact-left">💥</span>

    <!-- 발 사진 -->
    <div class="feet-box">
        <img
            src="img/foot.png"
            alt="발"
        >
    </div>

    <!-- 오른쪽 💥 -->
    <span class="impact impact-right">💥</span>

    </div>


    <!-- ⑤ 잠시만요 -->
    <button
        type="button"
        class="wait-button"
        id="waitButton">
        잠시만요ㅠㅠ
    </button>

</main>

    <script src="script/script.js"></script>

</body>

</html>
