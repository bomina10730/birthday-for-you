<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Seojun Day!🎂💗</title>

    <meta property="og:description" content="비밀 초대장">
    <meta property="og:image" content="https://bomina10730.github.io/birthday-for-you/img/greeting.jpg">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- 첫 화면 -->
    <main class="intro">

        <button type="button" class="hello-button" id="helloButton">
            입장하<br>
            기...
        </button>

    </main>


    <!-- 커튼 -->
    <div class="curtain-wrap" id="curtain">

        <div class="curtain curtain-left"></div>
        <div class="curtain curtain-right"></div>

    </div>

    <!-- =========================
     VVIP 확인 화면
========================= -->

<main class="vvip-screen" id="vvipScreen">

    <!-- 캐릭터 이미지 -->
    <div class="character-box">
        <img
            src="img/vvip.png"
            alt="VVIP 담당 직원"
        >
    </div>


    <!-- 말풍선 -->
    <div class="speech-bubble">

        <p>
            오늘은 VVIP 손님<br>
            예약건만 한 건 있습니다.<br>
            본인 맞으신가요?
        </p>

    </div>


    <!-- 선택 버튼 -->
    <div class="answer-buttons">

        <button
            type="button"
            class="answer-button yes-button"
            id="yesButton">
            예!
        </button>

        <button
            type="button"
            class="answer-button no-button"
            id="noButton">
            아닌데요?
        </button>

    </div>

</main>

    <script src="script/script.js"></script>

</body>

</html>
