<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Seojun Day!🎂💗</title>

    <meta property="og:image" content="https://bomina10730.github.io/birthday-for-you/img/greeting.jpg">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- 첫 화면 -->
    <main class="intro">

        <button type="button" class="hello-button" id="helloButton">
            어서오세<br>
            요...
        </button>

    </main>


    <!-- 커튼 -->
    <div class="curtain-wrap" id="curtain">

        <div class="curtain curtain-left"></div>
        <div class="curtain curtain-right"></div>

    </div>

    <!-- =========================
     VVIP 확인 화면
========================= -->

<main class="vvip-screen" id="vvipScreen">

    <!-- 캐릭터 이미지 -->
    <div class="character-box">
        <img
            src="img/vvip.jpg"
            alt="VVIP 담당 직원"
        >
    </div>


    <!-- 말풍선 -->
    <div class="speech-bubble">

        <p>
            오늘은 VVIP 손님<br>
            예약건만 한 건 있습니다.<br>
            김서준 본인 맞으신가요?
        </p>

    </div>


    <!-- 선택 버튼 -->
    <div class="answer-buttons">

        <button
            type="button"
            class="answer-button yes-button"
            id="yesButton">
            네!
        </button>

        <button
            type="button"
            class="answer-button no-button"
            id="noButton">
            아뇨?
        </button>

    </div>

</main>


<!-- =========================
     아니요 페이지
========================= -->

<main class="no-screen" id="noScreen">

    <!-- ① 하? -->
    <div class="no-scene scene-huh" id="sceneHuh">
    </div>


    <!-- =========================
        ② 캐릭터 + 문구
    ========================= -->

    <div class="no-scene scene-character" id="sceneCharacter">

        <div class="character-card">

            <!-- 캐릭터 사진 -->
            <div class="no-character-box">
                <img 
                    src="img/no.jpg" 
                    alt="캐릭터"
                >
            </div>

            <!-- 문구 -->
            <p class="no-text">
                그럼 왜 들어옴? 나가세요.
            </p>

        </div>

    </div>


    <!-- ③ 겔아웃! -->
    <div class="no-scene scene-getout" id="sceneGetout">
    </div>


    <!-- ④ 발 사진 + 퍽퍽 -->
<div class="no-scene scene-feet" id="sceneFeet">

    <!-- 💥 빨간 타격 효과 -->
    <div class="hit-flash"></div>

    <!-- 왼쪽 💥 -->
    <span class="impact impact-left">💥</span>

    <!-- ⭐ 발 위치를 담당하는 래퍼 -->
    <div class="feet-position">

        <!-- 발 사진 -->
        <div class="feet-box">
            <img
                src="img/foot.png"
                alt="발"
            >
        </div>

    </div>

    <!-- 오른쪽 💥 -->
    <span class="impact impact-right">💥</span>

</div>


    <!-- ⑤ 잠시만요 -->
    <button
        type="button"
        class="wait-button"
        id="waitButton">
        잠시만요ㅠㅠ
    </button>

</main>


<!-- YES 페이지 -->
<main class="yes-screen" id="yesScreen">

    <!-- 폭죽이 생성되는 공간 -->
    <div class="firework-container" id="fireworkContainer"></div>

    <!-- 생일축하 사진 -->
    <div class="yes-photo">
        <img src="img/yes.jpg" alt="생일 사진">
    </div>


    <!-- =========================
         사진 + 메시지 1
    ========================= -->
    <section class="memory memory-1">

        <div class="memory-photo">
            <img src="img/message1.jpg" alt="사진 1">
        </div>

        <div class="memory-message">
            <p>서준삐 생일축하해!!</p>
        </div>

    </section>


    <!-- =========================
         사진 + 메시지 2
    ========================= -->
    <section class="memory memory-2">

        <div class="memory-photo">
            <img src="img/message2.jpg" alt="사진 2">
        </div>

        <div class="memory-message">
            <p>항상 새로운 곳,예쁜 곳 데려가서<br>
                소중한 추억 만들어줘서 고마워♡</p>
        </div>

    </section>


    <!-- =========================
         사진 + 메시지 3
    ========================= -->
    <section class="memory memory-3">

        <div class="memory-photo">
            <img src="img/message3.jpg" alt="사진 3">
        </div>

        <div class="memory-message">
            <p>하늘만큼 땅만큼 사랑해💋</p>
        </div>

    </section>


    <!-- =========================
     사진 + 메시지 4
    ========================= -->

    <section class="memory memory-4">

        <div class="memory-photo">
            <img src="img/message4.jpg" alt="사진 4">
        </div>

        <div class="memory-message">
            <p>이제부터가 진짜 선물이야!!!</p>
        </div>

    </section>

</main>

<!-- =========================
     KUJI 기본 화면
========================= -->

<main class="kuji-screen" id="kujiScreen">

    <!-- 로고 -->
    <div class="kuji-logo">
        <img src="img/kuji-logo.png" alt="KUJI 로고">
    </div>

    <!-- 쿠지판 -->
    <div class="kuji-board">

        <div class="kuji-item">
            <img src="img/kuji.png" alt="쿠지">
        </div>

        <div class="kuji-item">
            <img src="img/kuji.png" alt="쿠지">
        </div>

        <div class="kuji-item">
            <img src="img/kuji.png" alt="쿠지">
        </div>

        <div class="kuji-item">
            <img src="img/kuji.png" alt="쿠지">
        </div>

        <div class="kuji-item">
            <img src="img/kuji.png" alt="쿠지">
        </div>

        <div class="kuji-item">
            <img src="img/kuji.png" alt="쿠지">
        </div>

        <div class="kuji-item">
            <img src="img/kuji.png" alt="쿠지">
        </div>

        <div class="kuji-item">
            <img src="img/kuji.png" alt="쿠지">
        </div>

        <div class="kuji-item">
            <img src="img/kuji.png" alt="쿠지">
        </div>

        <div class="kuji-item">
            <img src="img/kuji.png" alt="쿠지">
        </div>

        <div class="kuji-item">
            <img src="img/kuji.png" alt="쿠지">
        </div>

        <div class="kuji-item">
            <img src="img/kuji.png" alt="쿠지">
        </div>

    </div>

    <!-- 쿠지 선택 후 어두워지는 배경 -->
<div class="kuji-overlay" id="kujiOverlay"></div>

    <!-- =========================
    쿠지 선택 버튼
    ========================= -->
    <button
        type="button"
        class="kuji-select-button"
        id="kujiSelectButton">
        선택하기
    </button>
        
</main>

    <script src="script/script.js"></script>

</body>

</html>
